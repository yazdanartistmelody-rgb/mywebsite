<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Website</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: #0f0f0f;
            color: white;
        }

        header {
            height: 70px;
            background: #181818;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 50px;
            border-bottom: 1px solid #333;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 25px;
        }

        nav a:hover {
            color: #aaa;
        }

        .hero {
            min-height: calc(100vh - 70px);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }

        .hero-content {
            max-width: 700px;
        }

        h1 {
            font-size: 55px;
            margin-bottom: 20px;
        }

        .description {
            font-size: 20px;
            color: #bbbbbb;
            line-height: 1.8;
        }

        .button {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 35px;
            background: white;
            color: black;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .button:hover {
            transform: scale(1.05);
            background: #dddddd;
        }

        @media (max-width: 600px) {
            header {
                padding: 0 20px;
            }

            nav {
                display: none;
            }

            h1 {
                font-size: 38px;
            }

            .description {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        MY WEBSITE
    </div>

    <nav>
        <a href="#">خانه</a>
        <a href="#">درباره من</a>
        <a href="#">تماس</a>
    </nav>

</header>


<section class="hero">

    <div class="hero-content">

        <h1>سلام 👋</h1>

        <p class="description">
            به وب‌سایت من خوش آمدید.
            این سایت با Python و Flask ساخته شده است.
        </p>

        <a href="/about" class="button">
مهسا
        </a>

    </div>

</section>

</body>

</html>
